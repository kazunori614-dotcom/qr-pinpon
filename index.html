<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QRピンポン</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  text-align:center;
  background:#f5f7fb;
  padding:20px;
}
h1{font-size:32px}
#reader{
  max-width:450px;
  margin:20px auto;
  background:white;
  border-radius:15px;
  overflow:hidden;
}
#result{
  font-size:28px;
  font-weight:bold;
  margin:25px 0;
  min-height:40px;
}
button{
  width:90%;
  max-width:350px;
  padding:16px;
  margin:10px;
  border:0;
  border-radius:15px;
  font-size:20px;
  background:#007aff;
  color:white;
}
#again{
  display:none;
  background:#34c759;
}
</style>
</head>

<body>

<h1>🔔 QRピンポン</h1>

<p>正解番号</p>
<h2>12345</h2>

<div id="reader"></div>

<div id="result">
QRを読み取ってね
</div>

<button id="start" onclick="startScanner()">
📷 QRを読み取る
</button>

<button id="again" onclick="startScanner()">
🔄 もう一度読む
</button>

<script>

const CORRECT = "12345";

let scanner = null;
let audioContext = null;


// ======================================
// 音声を準備
// 「QRを読み取る」ボタンを押した瞬間に実行
// ======================================

function prepareAudio(){

  const AudioContext =
    window.AudioContext ||
    window.webkitAudioContext;

  if(!audioContext){
    audioContext = new AudioContext();
  }

  if(audioContext.state === "suspended"){
    audioContext.resume();
  }
}


// ======================================
// ピンポーン音
// ======================================

function playCorrectSound(){

  prepareAudio();

  const now = audioContext.currentTime;


  // ピン♪

  const o1 = audioContext.createOscillator();
  const g1 = audioContext.createGain();

  o1.type = "sine";
  o1.frequency.value = 880;

  g1.gain.setValueAtTime(0.35, now);
  g1.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.35
  );

  o1.connect(g1);
  g1.connect(audioContext.destination);

  o1.start(now);
  o1.stop(now + 0.35);


  // ポーン♪

  const o2 = audioContext.createOscillator();
  const g2 = audioContext.createGain();

  o2.type = "sine";
  o2.frequency.value = 660;

  g2.gain.setValueAtTime(0.35, now + 0.3);
  g2.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.9
  );

  o2.connect(g2);
  g2.connect(audioContext.destination);

  o2.start(now + 0.3);
  o2.stop(now + 0.9);
}


// ======================================
// ブブー音
// ======================================

function playWrongSound(){

  prepareAudio();

  const now = audioContext.currentTime;

  const o = audioContext.createOscillator();
  const g = audioContext.createGain();

  o.type = "square";
  o.frequency.value = 180;

  g.gain.setValueAtTime(0.25, now);
  g.gain.exponentialRampToValueAtTime(
    0.001,
    now + 0.5
  );

  o.connect(g);
  g.connect(audioContext.destination);

  o.start(now);
  o.stop(now + 0.5);
}


// ======================================
// QR読み取り開始
// ======================================

async function startScanner(){

  // ★ここで音声を準備する
  prepareAudio();

  document.getElementById("result").textContent =
    "📷 QRコードを見せてね";

  document.getElementById("start").style.display =
    "none";

  document.getElementById("again").style.display =
    "none";


  if(scanner){

    try{
      await scanner.clear();
    }catch(e){}

  }


  scanner = new Html5Qrcode("reader");


  try{

    await scanner.start(

      {facingMode:"environment"},

      {
        fps:10,
        qrbox:250
      },

      async function(decodedText){

        const number = decodedText.trim();


        if(number === CORRECT){

          document.getElementById("result").textContent =
            "🔔 ピンポーン！🎉";

          playCorrectSound();

        }else{

          document.getElementById("result").textContent =
            "❌ ブブー！";

          playWrongSound();

        }


        try{
          await scanner.stop();
        }catch(e){}


        document.getElementById("again").style.display =
          "block";

      }

    );

  }catch(error){

    document.getElementById("result").textContent =
      "⚠️ カメラを起動できませんでした";

    document.getElementById("start").style.display =
      "block";

    console.log(error);
  }
}

</script>

</body>
</html>
